<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Peek, Find, Folders</title>
  <desc id="desc">Design illustration of an opaque tab preview, a top-right search panel, and clear folder rows. Not a native browser screenshot.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#edeef4}
      .name{font-size:20px;font-weight:600}.label{font-size:13px;fill:#abb0c5}.body{font-size:14px}.small{font-size:12px;fill:#b8bdd0}
      .icon{fill:none;stroke:#b8bdd0;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <clipPath id="image"><rect x="54" y="176" width="284" height="112" rx="8"/></clipPath>
  </defs>
  <rect width="1200" height="360" rx="20" fill="#1c1e2b"/>
  <path d="M400 32v296M800 32v296" stroke="#353848"/>
  <text x="36" y="48" class="name">Peek</text>
  <text x="36" y="72" class="label">Know which tab you are opening.</text>
  <rect x="38" y="100" width="316" height="204" rx="15" fill="#2b2e40" stroke="#51556b"/>
  <text x="54" y="128" class="body" font-weight="600">A place for your ideas</text>
  <text x="54" y="150" class="small">example.com</text>
  <g clip-path="url(#image)">
    <rect x="54" y="176" width="284" height="112" fill="#e9eee5"/>
    <rect x="66" y="188" width="108" height="88" rx="4" fill="#b7d0bf"/>
    <path d="M66 265l45-57 63 68H66Z" fill="#628477"/>
    <path d="M192 202h120m-120 14h85" stroke="#51695f" stroke-width="5" stroke-linecap="round"/>
    <path d="M192 240h120m-120 12h103m-103 12h112" stroke="#bdc6bb" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="436" y="48" class="name">Find</text>
  <text x="436" y="72" class="label">Search stays close to your content.</text>
  <rect x="436" y="100" width="328" height="156" rx="15" fill="#2b2e40" stroke="#51556b"/>
  <rect x="450" y="114" width="196" height="34" rx="7" fill="#232636" stroke="#c1ace4" stroke-width="2"/>
  <text x="460" y="136" class="body">ideas</text>
  <path d="M660 134l5-5 5 5m14-5 5 5 5-5m24-3 10 10m0-10-10 10" class="icon"/>
  <rect x="452" y="167" width="12" height="12" rx="3" fill="#c1ace4"/>
  <path d="m455 173 2 2 4-5" fill="none" stroke="#252737" stroke-width="1.5"/>
  <text x="472" y="177" class="small">Highlight all</text>
  <rect x="608" y="167" width="12" height="12" rx="3" class="icon"/>
  <text x="628" y="177" class="small">Match case</text>
  <path d="M450 199h300" stroke="#45495f"/>
  <text x="452" y="229" class="small">2 of 7 matches</text>
  <rect x="450" y="277" width="43" height="21" rx="4" fill="#e5d5f5"/>
  <text x="456" y="292" style="font-size:13px;fill:#392b4a">ideas</text>
  <text x="503" y="292" class="label">worth finding again.</text>
  <text x="836" y="48" class="name">Folders</text>
  <text x="836" y="72" class="label">See where everything belongs.</text>
  <rect x="836" y="100" width="328" height="204" rx="15" fill="#232636" stroke="#41465b"/>
  <rect x="848" y="112" width="304" height="36" rx="7" fill="#34354e"/>
  <path d="m860 127 5 5 5-5m14-6h9l3 4h14v13h-26Z" class="icon"/>
  <text x="922" y="135" class="body">Projects</text>
  <path d="M887 157v85" stroke="#555a72"/>
  <circle cx="910" cy="170" r="5" fill="#c1ace4"/>
  <text x="928" y="175" class="small">A place for your ideas</text>
  <circle cx="910" cy="202" r="5" fill="#9ac3b2"/>
  <text x="928" y="207" class="small">Reading list</text>
  <path d="m907 229 4 4-4 4m18-11h7l3 3h12v11h-22Z" class="icon"/>
  <text x="959" y="238" class="small">Design</text>
  <path d="m862 267 5 5-5 5m22-12h9l3 4h14v13h-26Z" class="icon"/>
  <text x="922" y="279" class="body">Archive</text>
  <text x="36" y="337" class="small">Native controls. Independent mods. Your browser theme.</text>
